<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pausa, propuesta de diseño</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="glass-common.css">
<link rel="stylesheet" href="theme-light.css">
<link rel="stylesheet" href="theme-dark.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body data-design="dark">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-9M12 20V5M19 20v-6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M12 7l3.5 1.5v3c0 2.6-1.5 4.3-3.5 5.4-2-1.1-3.5-2.8-3.5-5.4v-3z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
</svg>

<header class="top">
  <h1>Pausa, propuesta de diseño</h1>
  <p id="design-note"></p>
  <div class="design-switch" role="group" aria-label="Tema">
    <button type="button" data-d="light" aria-pressed="false">Claro</button>
    <button type="button" data-d="dark" aria-pressed="true">Oscuro</button>
  </div>
  <button class="btn-small" id="open-panel" type="button">Mis cambios <span id="count">(0)</span></button>
</header>

<main class="gallery" id="gallery-light" hidden></main>
<main class="gallery" id="gallery-dark" hidden></main>

<aside class="panel" id="panel" aria-label="Pedir cambios" aria-hidden="true">
  <h2>Pedir un cambio</h2>
  <div><label for="note-screen">Pantalla</label><select id="note-screen"></select></div>
  <div><label for="note-text">Qué cambiarías</label><textarea id="note-text" placeholder="Por ejemplo: la esfera más grande, otro color de acento, quitar la racha de esta pantalla."></textarea></div>
  <button class="btn btn-primary" type="button" id="note-save">Guardar cambio pedido</button>
  <p class="state" id="note-state" role="status"></p>
  <ul class="notes" id="notes"></ul>
  <button class="btn-small" type="button" id="close-panel">Cerrar</button>
</aside>

<script src="app.js"></script>
<script type="module" src="glass3d.js"></script>
</body>
</html>
